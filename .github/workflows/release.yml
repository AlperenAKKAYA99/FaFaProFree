name: Release Packaging & Distribution
run-name: "Release Packaging: ${{ inputs.version != '' && format('v{0} ({1})', inputs.version, inputs.profile) || github.ref_name }}"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Font Awesome version to package (e.g. latest, last, 7.3.1, 6.7.2, 5.15.4)'
        required: true
        default: 'latest'
      profile:
        type: choice
        description: 'Profile(s) to package'
        options:
          - 'all'
          - 'Free'
          - 'Pro'
          - 'Pro-Plus'
        default: 'all'
      scan_versions:
        type: boolean
        description: 'Scan and publish release discovery table in summary'
        default: true

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  package-release:
    name: Package Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests -v

      - name: Scan Releases & Publish Summary
        run: |
          python scripts/version_resolver.py --refresh --github-summary

      - name: Determine Target Version
        id: target_version
        run: |
          INPUT_VER="${{ github.event.inputs.version }}"
          if [ -z "$INPUT_VER" ] || [ "$INPUT_VER" = "latest" ] || [ "$INPUT_VER" = "last" ]; then
            RESOLVED=$(python scripts/version_resolver.py --get-latest)
            echo "version=$RESOLVED" >> "$GITHUB_OUTPUT"
            echo "Packaging latest version: $RESOLVED"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
            echo "Packaging tag version: $TAG"
          else
            CLEAN_VER="${INPUT_VER#v}"
            echo "version=$CLEAN_VER" >> "$GITHUB_OUTPUT"
            echo "Packaging selected version: $CLEAN_VER"
          fi

      - name: Build Free Profile
        if: |
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.profile == 'all' ||
          github.event.inputs.profile == 'Free'
        run: |
          python fa_pro_v3.py \
            --version ${{ steps.target_version.outputs.version }} \
            --profile Free \
            --css --fonts --non-interactive --archive

      - name: Build Pro Profile
        if: |
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.profile == 'all' ||
          github.event.inputs.profile == 'Pro'
        env:
          FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_TOKEN }}
        run: |
          python fa_pro_v3.py \
            --version ${{ steps.target_version.outputs.version }} \
            --profile Pro \
            --css --fonts --non-interactive --archive

      - name: Build Pro-Plus Profile
        if: |
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.profile == 'all' ||
          github.event.inputs.profile == 'Pro-Plus'
        env:
          FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_TOKEN }}
        run: |
          python fa_pro_v3.py \
            --version ${{ steps.target_version.outputs.version }} \
            --profile Pro-Plus \
            --css --fonts --non-interactive --archive

      - name: Verify All Generated Builds (Strict)
        run: |
          python scripts/verify_build.py --level strict

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: FaFaProFree-v${{ steps.target_version.outputs.version }}-Packages
          path: FaFaProFree-*.zip
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.target_version.outputs.version }}
          name: "FaFaProFree v${{ steps.target_version.outputs.version }}"
          files: FaFaProFree-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
